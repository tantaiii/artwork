version: 0.2

phases:
  install:
    runtime-versions:
      nodejs: 20
    commands:
      - cd Frontend
      - npm install --legacy-peer-deps

  build:
    commands:
      - CI=false npm run build

  post_build:
    commands:
      - aws s3 sync build/ s3://deploy-arthub --acl public-read --delete

artifacts:
  files:
    - "**/*"
  base-directory: Frontend/build

